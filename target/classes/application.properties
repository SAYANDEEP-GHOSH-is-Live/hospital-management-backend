spring.application.name=hospital

# Tells Spring Boot to save the database to a file named 'hospitaldb' in your project folder
spring.datasource.url=jdbc:h2:file:./hospitaldb
spring.datasource.username=admin
spring.datasource.password=admin

# Tells Hibernate to automatically create or update our database tables
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL code Hibernate writes for us in the console
spring.jpa.show-sql=true